name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 통합 테스트는 GitHub 기본 Ubuntu 실행 환경의 Docker로 Postgres 18을 띄운다(Testcontainers).
      - run: pnpm turbo run lint typecheck test build
        env:
          API_URL: http://localhost:4000

  # 핵심 사용자 흐름 e2e(DECISIONS H-1, 10-3a). 기존 검사와 따로 돌려 서로 기다리지 않게 한다.
  # Postgres는 Testcontainers로 띄우고, web·api는 프로덕션 빌드로 띄운다(apps/browser-tests/e2e/start-servers.ts).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nodeloom/browser-tests exec playwright install --with-deps chromium
      - run: pnpm e2e
      # 실패하면 화면 기록(trace)과 보고서를 남겨 원인을 볼 수 있게 한다.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/browser-tests/playwright-report
            apps/browser-tests/test-results
          retention-days: 7
